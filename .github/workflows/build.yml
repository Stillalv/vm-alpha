name: Build & Release VM-Alpha APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VM-Alpha-v3.2.86-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VM-Alpha-v3.2.86-APK
          path: VM-Alpha-v3.2.86-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v3.2.86-alpha
          name: "VM Alpha v3.2.86 (Side-by-Side Build)"
          body: |
            ### VM Alpha v3.2.86 (Clean-Room Reconstructed Build)
            - **Package Name (`applicationId`)**: `com.alpha.android.dual.space` (Tidak bentrok dengan versi original `com.clone.android.dual.space`, bisa di-install bersamaan / side-by-side)
            - **VIP / Plan Status**: Permanently Unlocked (Plan Mati & No Ads)
            - **Device Presets**: Optional Android 7.1.2, Android 5.1.1, & Modern Flagship Presets
            - **GPU Database**: 97 GPUs (Android 4.0 – Present)
            - **Real-Device Hardening**: Valid IEEE Vendor OUI MAC, Dynamic per-VM LAN IP (`192.168.1.X`), Sensor Gaussian Micro-Noise, & `/proc/self/mounts` + `/proc/self/maps` Anti-Detection
          files: VM-Alpha-v3.2.86-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
